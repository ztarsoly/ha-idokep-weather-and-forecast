name: Release

# Publishes a GitHub release (which HACS offers as an update) when a tag is
# pushed. The tag must equal the version in manifest.json, e.g.:
#   git tag 1.01 && git push origin 1.01

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    name: "Release"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check the tag matches the manifest version
        run: |
          VERSION=$(jq -r '.version' custom_components/idokep_weather_and_forecast/manifest.json)
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match manifest.json version $VERSION"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Run tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r test-requirements.txt
          python -m pytest tests/

      - name: HACS validation
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration

      - name: Build the zip
        run: |
          cd custom_components
          zip -r "../idokep_weather_and_forecast-$GITHUB_REF_NAME.zip" idokep_weather_and_forecast \
            -x "*/__pycache__/*" "*.pyc"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "idokep_weather_and_forecast-$GITHUB_REF_NAME.zip" \
            --title "Időkép Weather & Forecast $GITHUB_REF_NAME" \
            --generate-notes
